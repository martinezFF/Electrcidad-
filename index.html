<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#25D366">
<title>Lista de Materiales</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #f0f4f8; }
  body { padding: 12px 12px 100px; font-size: 16px; }

  .container { max-width: 700px; margin: auto; background: #fff; padding: 16px;
               border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h1 { color: #1e3a8a; text-align: center; margin: 0 0 4px; font-size: 19px; }
  .sub { text-align: center; color: #64748b; font-size: 13px; margin: 0 0 16px; }

  /* ==== DATOS CLIENTE ==== */
  .cliente { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 8px; }
  .cliente input {
    padding: 13px; border: 1px solid #cbd5e1; border-radius: 8px;
    font-size: 16px; width: 100%; background: #fff;
  }
  .cliente input:focus { outline: none; border-color: #25D366;
                         box-shadow: 0 0 0 3px rgba(37,211,102,.15); }

  /* ==== BUSCADOR ==== */
  .buscador { width: 100%; padding: 12px; border: 1px solid #cbd5e1;
              border-radius: 8px; font-size: 16px; margin: 14px 0 10px; }

  /* ==== BOTONES SUPERIORES ==== */
  .acciones-top { display: flex; gap: 8px; margin-bottom: 12px; }
  .acciones-top button {
    flex: 1; padding: 10px; border: 1px solid #cbd5e1; background: #f8fafc;
    border-radius: 8px; font-size: 13px; font-weight: 600; color: #334155;
    cursor: pointer;
  }
  .acciones-top button:active { background: #e2e8f0; }

  /* ==== MATERIALES ==== */
  .material {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; margin-bottom: 7px;
    border: 1px solid #e2e8f0; border-radius: 10px;
    background: #fff; transition: .15s;
  }
  .material.activo { border-color: #25D366; background: #f0fdf4; }
  .material.oculto { display: none; }

  .chk-wrap { display: flex; align-items: center; justify-content: center;
              min-width: 32px; height: 32px; }
  .chk-wrap input[type="checkbox"] {
    width: 24px; height: 24px; cursor: pointer; accent-color: #25D366;
  }
  .nombre { flex: 1; font-size: 15px; color: #1e293b; line-height: 1.25; }

  .cant-wrap { display: flex; flex-direction: column; align-items: center; min-width: 72px; }
  .cant-wrap label { font-size: 9px; color: #64748b; text-transform: uppercase; margin-bottom: 2px; }
  .cant-wrap input[type="number"] {
    width: 72px; padding: 10px 4px; border: 1px solid #cbd5e1; border-radius: 8px;
    text-align: center; font-size: 16px; font-weight: bold; background: #f8fafc;
    -moz-appearance: textfield;
  }
  .cant-wrap input[type="number"]::-webkit-outer-spin-button,
  .cant-wrap input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .cant-wrap input:disabled { background: #f1f5f9; color: #94a3b8; }
  .cant-wrap input:enabled { background: #fff; border-color: #25D366; }
  .cant-wrap input.error { border-color: #dc2626; background: #fef2f2; }
  .cant-wrap input:enabled:focus { outline: none; box-shadow: 0 0 0 3px rgba(37,211,102,.2); }

  /* ==== BARRA FIJA ==== */
  .barra-fija {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #fff; border-top: 1px solid #e2e8f0;
    padding: 10px 12px; z-index: 100;
    box-shadow: 0 -3px 12px rgba(0,0,0,.08);
  }
  .contador { text-align: center; font-size: 12px; color: #64748b; margin-bottom: 6px; }
  .btn-enviar {
    width: 100%; padding: 16px; border: none; border-radius: 10px;
    background: #25D366; color: #fff; font-size: 17px; font-weight: bold;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-enviar:active { transform: scale(.98); background: #1ebe5a; }

  /* ==== TOAST ==== */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
    background: #1e293b; color: #fff; padding: 12px 20px; border-radius: 8px;
    font-size: 14px; z-index: 200; transition: .3s; box-shadow: 0 4px 15px rgba(0,0,0,.2);
    max-width: 90%;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media print {
    body { padding: 0; }
    .barra-fija, .buscador, .acciones-top, .sub, .chk-wrap, .cant-wrap label { display: none !important; }
    .material { border: 1px solid #ccc; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>⚡ Lista de Materiales</h1>
  <p class="sub">Marque lo que necesita y escriba la cantidad</p>

  <div class="cliente">
    <input type="text" id="nombre" placeholder="👤 Nombre del cliente" autocomplete="name">
    <input type="tel" id="telefono" placeholder="📱 WhatsApp del cliente (con código país)"
           inputmode="tel" autocomplete="tel">
  </div>

  <input type="text" class="buscador" id="buscador" placeholder="🔍 Buscar material..."
         oninput="filtrar()">

  <div class="acciones-top">
    <button onclick="marcarTodo(true)">✓ Marcar todo</button>
    <button onclick="marcarTodo(false)">✗ Limpiar</button>
  </div>

  <div id="listaMateriales"></div>
</div>

<div class="barra-fija">
  <div class="contador" id="contador">Seleccionados: 0</div>
  <button class="btn-enviar" onclick="enviarWhatsApp()">
    📱 Enviar lista por WhatsApp
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
const materiales = [
  "TOMA CORRIENTES 110 V",
  "TOMA CORRIENTE 220 V",
  "CAJAS 2*4",
  "CAJAS 4*4",
  "TAPA CIEGAS 2*4",
  "TAPA CIEGAS 4*4",
  "TUBOS CONDUIT DE MEDIA ECAMISADOS",
  "TUBOS CONDUIT ¾ ENCAMISADOS",
  "UNIONES CONDUIT DE MEDIA",
  "UNIONES CONDUIT ¾",
  "BRIDAS CONDUIT DE MEDIA METALICAS",
  "BRIDAS CONDUIT ¾ METALICAS",
  "CONECTORES CONDUIT DE MEDIA",
  "CONECTORES CONDUIT ¾",
  "APAGADORES SENCILLOS",
  "APAGADORES DOBLES",
  "APAGADORES TRIPLE",
  "APAGADOR MIXTO",
  "APAGADOR MIXTO CONMUTADO",
  "APAGADOR MIXTO DOBLE",
  "APAGADOR CONMUTADO SENCILLO",
  "APAGADOR CONMUTADO DOBLE",
  "APAGADOR CONMUTADO DE 4 VIAS",
  "CURVAS CONDUIT DE MEDIA",
  "CURVAS CONDUIT ¾",
  "TEYPE MARCA 3M",
  "ALAMBRE N° 10 CAJA COLOR BLANCO",
  "ALAMBRE N° 10 CAJA COLOR NEGRO",
  "ALAMBRE N° 12 CAJA COLOR VERDE",
  "ALAMBRE N° 12 CAJA COLOR ROJO",
  "ALAMBRE N° 12 CAJA COLOR AZUL",
  "VARILLA DE COBRE PUESTA A TIERRA",
  "CENTRO DE CARGA",
  "CEPOS DE PLATO",
  "BUJIAS",
  "OJOS DE BUEY",
  "BREAKER DE 15 A",
  "BREAKER DE 20 A",
  "BREAKER DE 30 A",
  "BREAKER DE 40 A",
  "LAMPARA DE PARED"
];

const cont = document.getElementById('listaMateriales');

materiales.forEach((m, i) => {
  const div = document.createElement('div');
  div.className = 'material';
  div.id = `mat-${i}`;
  div.dataset.nombre = m.toLowerCase();
  div.innerHTML = `
    <label class="chk-wrap">
      <input type="checkbox" data-idx="${i}" onchange="toggle(${i})">
    </label>
    <div class="nombre">${m}</div>
    <div class="cant-wrap">
      <label>Cant.</label>
      <input type="number" min="1" step="1" inputmode="numeric" pattern="[0-9]*"
             placeholder="—" id="cant-${i}" disabled>
    </div>
  `;
  cont.appendChild(div);
});

/* Cargar datos guardados */
cargarEstado();

function toggle(i){
  const chk  = document.querySelector(`input[data-idx="${i}"]`);
  const cant = document.getElementById(`cant-${i}`);
  const card = document.getElementById(`mat-${i}`);

  cant.disabled = !chk.checked;
  card.classList.toggle('activo', chk.checked);

  if(!chk.checked){
    cant.value = "";
    cant.classList.remove('error');
  } else {
    setTimeout(() => cant.focus(), 50);
  }
  actualizarContador();
  guardarEstado();
}

function actualizarContador(){
  const n = document.querySelectorAll('input[type="checkbox"]:checked').length;
  document.getElementById('contador').textContent = `Seleccionados: ${n}`;
}

function filtrar(){
  const q = document.getElementById('buscador').value.toLowerCase().trim();
  materiales.forEach((m, i) => {
    const el = document.getElementById(`mat-${i}`);
    el.classList.toggle('oculto', q !== '' && !m.toLowerCase().includes(q));
  });
}

function marcarTodo(estado){
  materiales.forEach((m, i) => {
    const chk = document.querySelector(`input[data-idx="${i}"]`);
    if(chk.checked !== estado){
      chk.checked = estado;
      toggle(i);
    }
  });
}

function obtenerSeleccionados(){
  const lista = [];
  let faltan = false;

  materiales.forEach((m, i) => {
    const chk  = document.querySelector(`input[data-idx="${i}"]`);
    const cant = document.getElementById(`cant-${i}`);
    cant.classList.remove('error');

    if(chk.checked){
      const v = cant.value.trim();
      if(v === "" || Number(v) <= 0){
        cant.classList.add('error');
        faltan = true;
      } else {
        lista.push({ material: m, cantidad: v });
      }
    }
  });

  if(faltan){
    mostrarToast('⚠️ Faltan cantidades en rojo');
    return null;
  }
  return lista;
}

function enviarWhatsApp(){
  const nombre = document.getElementById('nombre').value.trim();
  const telefono = document.getElementById('telefono').value.trim();

  if(!nombre){ mostrarToast('⚠️ Escribe el nombre del cliente'); return; }

  const lista = obtenerSeleccionados();
  if(!lista) return;
  if(lista.length === 0){ mostrarToast('⚠️ Marca al menos un material'); return; }

  // Construir mensaje
  let msg = `*LISTA DE MATERIALES ELÉCTRICOS*\n`;
  msg += `Cliente: ${nombre}\n`;
  msg += `Fecha: ${new Date().toLocaleDateString()}\n`;
  msg += `--------------------------------\n\n`;
  lista.forEach((it, i) => {
    msg += `${i+1}. ${it.material}\n     Cantidad: *${it.cantidad}*\n`;
  });
  msg += `\n--------------------------------\n`;
  msg += `Total de ítems: ${lista.length}\n\n`;
  msg += `_Lista enviada por WhatsApp_`;

  const texto = encodeURIComponent(msg);
  const tel = telefono.replace(/\D/g,'');

  // Detectar móvil
  const esMovil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  let url;
  if(tel){
    url = esMovil
      ? `whatsapp://send?phone=${tel}&text=${texto}`
      : `https://wa.me/${tel}?text=${texto}`;
  } else {
    url = `https://wa.me/?text=${texto}`;
  }

  mostrarToast('✅ Abriendo WhatsApp...');
  window.open(url, '_blank');

  guardarEstado();
}

/* ==== TOAST ==== */
let toastTimer;
function mostrarToast(txt){
  const t = document.getElementById('toast');
  t.textContent = txt;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

/* ==== AUTOGUARDADO ==== */
function guardarEstado(){
  const estado = {
    nombre: document.getElementById('nombre').value,
    telefono: document.getElementById('telefono').value,
    materiales: {}
  };
  materiales.forEach((m, i) => {
    const chk = document.querySelector(`input[data-idx="${i}"]`);
    const cant = document.getElementById(`cant-${i}`);
    if(chk.checked){
      estado.materiales[i] = cant.value;
    }
  });
  try { localStorage.setItem('listaMateriales', JSON.stringify(estado)); } catch(e){}
}

function cargarEstado(){
  try {
    const raw = localStorage.getItem('listaMateriales');
    if(!raw) return;
    const estado = JSON.parse(raw);
    document.getElementById('nombre').value = estado.nombre || '';
    document.getElementById('telefono').value = estado.telefono || '';

    Object.keys(estado.materiales || {}).forEach(i => {
      const chk = document.querySelector(`input[data-idx="${i}"]`);
      const cant = document.getElementById(`cant-${i}`);
      if(chk){
        chk.checked = true;
        cant.disabled = false;
        cant.value = estado.materiales[i];
        document.getElementById(`mat-${i}`).classList.add('activo');
      }
    });
    actualizarContador();
  } catch(e){}
}

/* Guardar automáticamente al escribir */
document.getElementById('nombre').addEventListener('input', guardarEstado);
document.getElementById('telefono').addEventListener('input', guardarEstado);
document.addEventListener('input', e => {
  if(e.target.matches('input[type="number"]')) guardarEstado();
});
</script>
</body>
</html>
